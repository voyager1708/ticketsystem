services:
  # Dockerfile で ARG や ENV を使っても、値を渡すには --build-arg オプションで明示的に指定する必要があります
  # export UID=1001
  # export GID=1001
  # export USERNAME=app
  # docker compose build --build-arg HOST_UID=1001 --build-arg HOST_GID=1001 --build-arg HOST_USERNAME=app --progress=plain --no-cache ticket_web
  ticket_web:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID}
        GID: ${HOST_GID}
        USERNAME: ${CONTAINER_USERNAME}
        NUM_WORKERS: ${NUM_WORKERS}
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    volumes:
      - ./app:/home/app/web                 # ソースコード全体をマウント（開発用）
      - ./.env:/home/app/.env               # 環境変数ファイルのマウント(DB初期化で書き換えるケースあり)
    networks:
      - betawallet-dev_default              # betawallet-dev のネットワークに参加して db に接続
    # DB は betawallet-dev の Docker db を使用。ticket_db は使わない。
    # vhost は betawallet-dev の nginx で ticket.buxbit.net として提供。ticket_nginx は使わない。

networks:
  betawallet-dev_default:
    external: true

