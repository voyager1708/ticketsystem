<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summer Festival 2026 Ticket</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a1a2e; }
    .ticket {
      width: 800px;
      height: 450px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .ticket-bg {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .ticket-info {
      position: absolute;
      left: 0;
      top: 0;
      width: 42%;
      height: 100%;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 1;
      background: linear-gradient(to right, rgba(26,26,46,0.85) 0%, rgba(26,26,46,0.4) 70%, transparent 100%);
      color: #fff;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }
    .ticket-info h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 24px;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .ticket-info .row {
      font-size: 14px;
      line-height: 1.9;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .ticket-info .label {
      color: rgba(255,255,255,0.75);
      min-width: 100px;
      font-weight: 500;
    }
    .ticket-info .value {
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
