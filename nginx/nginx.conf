upstream base_api {
    server 172.233.79.213:8000;
}

# Maximum upload size (for TicketDesign images, etc.)
client_max_body_size 50M;

server {
    listen 80;
    server_name ticket.buxbit.net;
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name linode.buxbit.net;
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ticket.buxbit.net;
    # SSL certificates from the default certbot location
    ssl_certificate /etc/letsencrypt/live/ticket.buxbit.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticket.buxbit.net/privkey.pem;
    # Recommended security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    location /static {
        alias /static;
        autoindex on;
        access_log /var/log/nginx/static_access.log;
        error_log /var/log/nginx/static_error.log debug;
    }

    # CORS for API endpoints (Swagger UI may be accessed via IP or domain)
    set $cors_origin "";
    if ($http_origin ~* ^https?://(ticket\.buxbit\.net|172\.233\.79\.213)$) {
        set $cors_origin $http_origin;
    }

    location /api/ext/v1/ {
        # Preflight requests
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRFToken, X-Requested-With" always;
            add_header Vary "Origin" always;
            return 204;
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;

        proxy_pass http://ticket_web:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Proxy to backend for other paths (Swagger, admin, static, etc.)
    location / {
        proxy_pass http://ticket_web:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}

server {
    listen 443 ssl;
    server_name linode.buxbit.net;
    # SSL certificates from the default certbot location
    ssl_certificate /etc/letsencrypt/live/linode.buxbit.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linode.buxbit.net/privkey.pem;
    # Recommended security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /static {
        alias /static_base;
        autoindex on;
        access_log /var/log/nginx/static_access.log;
        error_log /var/log/nginx/static_error.log debug;
    }

    # Proxy to base API backend
    location / {
        proxy_pass http://base_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}


